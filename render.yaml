services:
  - type: web
    name: orange-sprout-python
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_RELEASE
        value: postgres-answer-style-20260723
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: orange-sprout-db
          property: connectionString
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen3.6-flash
      - key: DASHSCOPE_API_KEY
        sync: false

databases:
  - name: orange-sprout-db
    plan: free
    region: singapore
