services:
  - type: web
    name: orange-sprout-python
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_RELEASE
        value: qwen-diagnostics-20260719
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen-plus
      - key: DASHSCOPE_API_KEY
        sync: false
